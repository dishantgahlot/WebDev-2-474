<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Manupilation</title>
    <link  rel="stylesheet" href="style.css">
</head>
<body>
    <!-- main div -->
<div class="main">

    <!-- display heading -->
    <div class="display">Welcome To JavaScript Lab</div>

    <!-- input div -->
   <div class="inputdiv">
    <input type="text" placeholder="Enter the new heading text" class="input">
   </div>

    <!-- buttons -->
    <div class="btns">

        <div  style="display: flex; flex-direction: row; gap: 12px;">

        </div>

        
        <div  style="display: flex; flex-direction: row; gap: 12px;">

        <button class="btn4">Show\Hide Paragraph</button>
        <button class="btn5">Reset</button>
       
        
        </div>

    </div>

</div>
    

    <script src="script.js"></script>
